<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>Editorial Publication Flow — Current State</title>
<desc>From content need to publication, maintenance and retirement.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#F1F5F9"/>
<text x="60" y="60" font-family="Arial" font-size="32" font-weight="700" fill="#0F172A">Editorial Publication Flow — Current State</text>
<text x="60" y="92" font-family="Arial" font-size="16" fill="#475569">From content need to publication, maintenance and retirement.</text>
<rect x="60" y="150" width="230" height="115" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="76" y="180" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">1. Identify Need</text>
<text x="76" y="208" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Purpose · audience · scope</text>
<rect x="340" y="150" width="230" height="115" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="356" y="180" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">2. Select Family</text>
<text x="356" y="208" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">OP · ADR · STD · GUIDE</text>
<rect x="620" y="150" width="230" height="115" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
<text x="636" y="180" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">3. Create Draft</text>
<text x="636" y="208" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Template · metadata · content</text>
<rect x="900" y="150" width="230" height="115" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="916" y="180" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">4. Validate Draft</text>
<text x="916" y="208" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Structure · links · confidentiality</text>
<polygon points="1345.0,130 1480,207.5 1345.0,285 1210,207.5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="1345.0" y="175" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">Ready for review?</text>
<text x="1345.0" y="203" text-anchor="middle" font-family="Arial" font-size="13" fill="#334155">Required content complete</text>
<rect x="1070" y="400" width="310" height="150" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
<text x="1086" y="430" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">5. Review Layers</text>
<text x="1086" y="458" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Editorial</text>
<text x="1086" y="477" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Technical / Product</text>
<text x="1086" y="496" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Repository</text>
<polygon points="815.0,400 950,477.5 815.0,555 680,477.5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="815.0" y="445" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">Approved?</text>
<text x="815.0" y="473" text-anchor="middle" font-family="Arial" font-size="13" fill="#334155">Findings resolved</text>
<rect x="280" y="400" width="280" height="150" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="296" y="430" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">Revision</text>
<text x="296" y="458" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Address findings</text>
<text x="296" y="477" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Return to review</text>
<rect x="630" y="700" width="350" height="145" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="646" y="730" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">6. Publish</text>
<text x="646" y="758" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Final status</text>
<text x="646" y="777" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Edition / version</text>
<text x="646" y="796" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Rendering validation</text>
<rect x="1080" y="700" width="300" height="145" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
<text x="1096" y="730" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">7. Maintain</text>
<text x="1096" y="758" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Corrections</text>
<text x="1096" y="777" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Living updates</text>
<text x="1096" y="796" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Edition Notes</text>
<rect x="180" y="700" width="300" height="145" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
<text x="196" y="730" text-anchor="start" font-family="Arial" font-size="17" font-weight="700" fill="#0F172A">Supersede or Retire</text>
<text x="196" y="758" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Preserve history</text>
<text x="196" y="777" text-anchor="start" font-family="Arial" font-size="13" fill="#334155">Point to replacement</text>
<line x1="290" y1="208" x2="340" y2="208" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="570" y1="208" x2="620" y2="208" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="850" y1="208" x2="900" y2="208" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="1130" y1="208" x2="1210" y2="208" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="1345" y1="285" x2="1225" y2="400" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<text x="1285.0" y="334.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Yes</text>
<line x1="1210" y1="208" x2="1130" y2="265" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="1170.0" y="228.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">No</text>
<line x1="1070" y1="475" x2="950" y2="475" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="815" y1="555" x2="805" y2="700" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<text x="810.0" y="619.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Yes</text>
<line x1="680" y1="475" x2="560" y2="475" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<text x="620.0" y="467.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">No</text>
<line x1="560" y1="475" x2="1070" y2="475" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<text x="815.0" y="467.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Resubmit</text>
<line x1="980" y1="772" x2="1080" y2="772" stroke="#64748B" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="1080" y1="815" x2="480" y2="815" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="780.0" y="807.0" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">When replaced</text>
<text x="1550" y="975" text-anchor="end" font-family="Arial" font-size="12" fill="#64748B">InfraDev Academy</text>
</svg>